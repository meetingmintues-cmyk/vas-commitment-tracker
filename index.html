  if(window.__GVIZ_OVERRIDE__ && window.__GVIZ_OVERRIDE__[name]) return window.__GVIZ_OVERRIDE__[name];
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&_ts=${Date.now()}`;
}
function num(v){const n=parseFloat(String(v==null?'':v).replace(/,/g,'').trim());return isNaN(n)?0:n}
function csvRows(text){const wb=XLSX.read(text,{type:'string'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
function findCol(H,re){return H.findIndex(h=>re.test(String(h||'').trim()))}

/* Live fetch uses a JSONP <script> tag against the gviz endpoint, NOT fetch() —
   a plain fetch() to docs.google.com from a self-hosted file/page routinely gets
   blocked by the browser's CORS check ("Failed to fetch"), because Google's gviz
   response doesn't reliably send permissive CORS headers for arbitrary origins.
   A <script src> load isn't subject to CORS at all (it's how Google Charts itself
   pulls Sheet data into any website), so this is the robust cross-origin route. */
function gvizJsonpUrl(name,cb){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=${encodeURIComponent(name)}&_ts=${Date.now()}`;
}
function tableToRows(table){
  if(!table) return [];
  const headers=(table.cols||[]).map(c=>c&&(c.label||c.id)||'');
  const rows=[headers];
  (table.rows||[]).forEach(r=>{
    rows.push((r.c||[]).map(cell=>{
      if(!cell) return '';
      if(cell.f!=null) return cell.f;
      if(cell.v!=null) return cell.v;
      return '';
    }));
  });
  return rows;
}
function fetchTabJsonp(name){
  return new Promise((resolve,reject)=>{
    const cb='__gviz_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    let done=false,script=null;
    const timer=setTimeout(()=>{ if(!done){done=true;cleanup();reject(new Error(name+': timed out reaching the sheet'));} },15000);
    function cleanup(){ clearTimeout(timer); try{delete window[cb]}catch(e){window[cb]=undefined} if(script&&script.parentNode) script.parentNode.removeChild(script); }
    window[cb]=function(resp){
      if(done) return; done=true; cleanup();
      if(!resp || resp.status==='error'){
        const first=resp&&resp.errors&&resp.errors[0];
        reject(new Error(name+': '+(first&&(first.detailed_message||first.message)||'the sheet returned an error — check the tab name and sharing settings')));
        return;
      }
      try{ resolve(tableToRows(resp.table)); }catch(e){ reject(e); }
    };
    script=document.createElement('script');
    script.src=gvizJsonpUrl(name,cb);
    script.onerror=()=>{ if(!done){done=true;cleanup();reject(new Error(name+': could not load from the sheet (check it is shared as "Anyone with the link can view")'));} };
    document.head.appendChild(script);
  });
}
async function fetchTab(name){
  // Test hook only: when a fixture override is set, fetch it as plain CSV (used by the automated test harness).
  if(window.__GVIZ_OVERRIDE__ && window.__GVIZ_OVERRIDE__[name]){
    const res=await fetch(gvizUrl(name),{cache:'no-store'});
    if(!res.ok) throw new Error(name+': HTTP '+res.status);
    const text=await res.text();
    if(/^\s*</.test(text)) throw new Error(name+': the sheet did not return CSV — check it is shared as "Anyone with the link can view"');
    return csvRows(text);
  }
  return fetchTabJsonp(name);
}
// Branches the live sheet reports that aren't in the plan file, with their real
// zone/cluster (learned once from the sheet's own grouping before it was flattened
// to one-row-per-branch — see project notes). Anything else unknown falls back to "Unmapped".
const KNOWN_ZONE={'33-PATTAMBI-NEXA':['ZONE-2','CLUSTER-2']};
function mergeBranch(name){
  if(!name) return;
  if(!BRX[name]) BRX[name]=BR[name]?BR[name].slice():(KNOWN_ZONE[name]?KNOWN_ZONE[name].slice():['Unmapped','Unmapped']);
}
function pushSorted(map,key,rec){(map[key]=map[key]||[]).push(rec)}
function finalizeSorted(map){Object.values(map).forEach(arr=>arr.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0))}
function latestBefore(arr,day){if(!arr)return null;let best=null;for(const s of arr){if(s.date<day)best=s;else break}return best}
function latestAtOrBefore(arr,day){if(!arr)return null;let best=null;for(const s of arr){if(s.date<=day)best=s;else break}return best}
// REV is a genuine DAILY LOG now (one row per branch per calendar date — confirmed
// against the live sheet: day-to-day VAS values are NOT monotonically increasing).
// Stored as REV[branch+'|'+dept][date] = {value,load} — keyed by date so a duplicate
// row for the same date overwrites instead of double-counting.
function setDailyRev(key,date,rec){(REV[key]=REV[key]||{})[date]=rec}
function sumRevBefore(key,cutoff){const m=REV[key];if(!m)return{value:0,load:0};let value=0,load=0;Object.keys(m).forEach(d=>{if(d<cutoff){value+=m[d].value;load+=m[d].load}});return{value,load}}
function sumRevAtOrBefore(key,cutoff){const m=REV[key];if(!m)return{value:0,load:0};let value=0,load=0;Object.keys(m).forEach(d=>{if(d<=cutoff){value+=m[d].value;load+=m[d].load}});return{value,load}}

// Revenue tab layout — auto-detected, no zone column (branch is column A directly).
// Two shapes are supported:
//  (a) split:    Workshop, BODYSHOP LOAD COUNT, VAS, PER CAR, SERVICE LOAD COUNT, VAS, PER CAR, Total LOAD COUNT, VAS, PER CAR, Date
//  (b) combined: Workshop, LOAD COUNT, VAS, PER CAR, Date  (single figure, no Bodyshop/Service split)
// For (b) the daily figure is proportioned into srv/bds using that branch's
// target split from the plan (branchDeptWeight), so every downstream calc
// (achievedBranchDept, advisor splitting, filters) keeps working unchanged.
function parseRevenue(rows){
  if(!rows||!rows.length) return;
  const H=rows[0];
  const iDate=findCol(H,/^date/i);
  if(iDate<0){SYNC_WARN.push(TAB_REVENUE+': no "Date" column found');return}
  const iBdsLoad=findCol(H,/bodyshop load/i), iBdsVas=iBdsLoad>=0?iBdsLoad+1:-1;
  const iSrvLoad=findCol(H,/service load/i), iSrvVas=iSrvLoad>=0?iSrvLoad+1:-1;
  const SPLIT=iBdsLoad>=0 && iSrvLoad>=0;
  const iLoad=SPLIT?-1:findCol(H,/load\s*count/i);
  const iVas=SPLIT?-1:(iLoad>=0?iLoad+1:findCol(H,/^vas$/i));
  if(!SPLIT && iLoad<0 && iVas<0){SYNC_WARN.push(TAB_REVENUE+': could not find LOAD COUNT / VAS columns');return}
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row||!row.length) continue;
    const bc=String(row[0]||'').trim();
    if(!bc || /^total$/i.test(bc)) continue;
    const date=toDate(row[iDate]); if(!date) continue;
    mergeBranch(bc);
    if(SPLIT){
      if(iBdsVas>=0) setDailyRev(bc+'|bds', date, {value:num(row[iBdsVas]), load:num(row[iBdsLoad])});
      if(iSrvVas>=0) setDailyRev(bc+'|srv', date, {value:num(row[iSrvVas]), load:num(row[iSrvLoad])});
    } else {
      const value=num(row[iVas]), load=num(row[iLoad]), w=branchDeptWeight(bc);
      setDailyRev(bc+'|srv', date, {value:value*w.srv, load:load*w.srv});
      setDailyRev(bc+'|bds', date, {value:value*w.bds, load:load*w.bds});
    }
  }
}
// Item tabs layout (also no zone column now): Workshop, <item codes...>, Total, Date.
// These remain CUMULATIVE month-to-date snapshots (per the user: "till date data
// show in the google sheet") — unlike revenue, which is a genuine daily log.
function parseItemSheet(rows, dept, label){
  if(!rows||!rows.length) return;
  const H=rows[0];
  const iDate=findCol(H,/^date/i);
  if(iDate<0){SYNC_WARN.push(label+': no "Date" column found');return}
  const items=[];
  for(let i=1;i<iDate;i++){
    const h=String(H[i]||'').trim(); if(!h) continue;
    if(/^total\b/i.test(h)) continue;
    let code=h.split(' Count')[0].trim();
    if(code==='RR') code='RD';
    if(code==='HWSR-W') code='HWSR';
    if(!P[code]){ if(!SYNC_WARN.includes('unk:'+code)){SYNC_WARN.push('unk:'+code); SYNC_WARN.push(label+': unrecognized item code "'+code+'" — ignored');} continue; }
    items.push({code, idx:i});
  }
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row||!row.length) continue;
    const bc=String(row[0]||'').trim();
    if(!bc || /^total$/i.test(bc)) continue;
    const date=toDate(row[iDate]); if(!date) continue;
    mergeBranch(bc);
    items.forEach(({code,idx})=>{ pushSorted(ITEMQ, bc+'|'+dept+'|'+code, {date, qty:num(row[idx])}); });
  }
}
function setSync(text,kind){
  const el=$('syncStatus'); el.textContent=text;
  el.style.background = kind=='ok'?'rgba(15,157,116,.32)' : kind=='bad'?'rgba(192,57,43,.4)' : 'rgba(255,255,255,.12)';
}
function saveCache(){try{localStorage.setItem(CACHE_KEY, JSON.stringify({REV,ITEMQ,BRX,ts:LAST_SYNC?LAST_SYNC.toISOString():null}))}catch(e){}}
function loadCache(){try{const raw=localStorage.getItem(CACHE_KEY);if(!raw)return false;const p=JSON.parse(raw);REV=p.REV||{};ITEMQ=p.ITEMQ||{};BRX=Object.assign({},BR,p.BRX||{});LAST_SYNC=p.ts?new Date(p.ts):null;return true}catch(e){return false}}

async function fetchAll(manual){
  if(FETCHING) return; FETCHING=true;
  setSync('Syncing…','busy');
  const warn=[];
  try{
    const [rev,srv,bds]=await Promise.all([fetchTab(TAB_REVENUE), fetchTab(TAB_SRV), fetchTab(TAB_BDS)]);
    const newREV={}, newITEMQ={}, newBRX={}; Object.keys(BR).forEach(b=>newBRX[b]=BR[b].slice());
    REV=newREV; ITEMQ=newITEMQ; BRX=newBRX; SYNC_WARN=[];
    parseRevenue(rev);
    parseItemSheet(srv,'srv',TAB_SRV);
    parseItemSheet(bds,'bds',TAB_BDS);
    finalizeSorted(ITEMQ);
    LAST_SYNC=new Date(); SYNC_ERR=null;
    saveCache();
    setSync('● Live — synced '+LAST_SYNC.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),'ok');
  }catch(err){
    SYNC_ERR=String(err&&err.message||err);
    const had=loadCache();
    setSync(had?'⚠ Could not reach the sheet — showing last saved data':'⚠ Could not reach the sheet','bad');
  }
  FETCHING=false;
  render();
}

/* ---------- date of latest data / tracking-day default ---------- */
function lastDataDate(){let m='';Object.values(REV).forEach(datesObj=>Object.keys(datesObj).forEach(d=>{if(d>m)m=d}));Object.values(ITEMQ).forEach(arr=>arr.forEach(s=>{if(s.date>m)m=s.date}));return m}
// DAY always tracks the real calendar date — no manual override. "Achieved" everywhere
// is read as the latest sheet snapshot strictly before DAY, i.e. "through yesterday."
function setToday(){DAY=ymd(new Date());const d=pd(DAY);const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];$('asOfChip').textContent='Today · '+d.getDate()+' '+mn[d.getMonth()]}

/* ---------- filters ---------- */
const inF=(c,z,b)=>(!F.c||c==F.c)&&(!F.z||z==F.z)&&(!F.b||b==F.b);
function fillSel(){const brs=Object.keys(BRX).sort();const opt=(id,arr,all,cur)=>{$(id).innerHTML=`<option value="">${all}</option>`+arr.map(x=>`<option value="${esc(x)}" ${x==cur?'selected':''}>${esc(x)}</option>`).join('')};
opt('fC',[...new Set(brs.map(b=>BRX[b][1]))].sort(),'All clusters',F.c);
opt('fZ',[...new Set(brs.filter(b=>!F.c||BRX[b][1]==F.c).map(b=>BRX[b][0]))].sort(),'All zones',F.z);
opt('fB',brs.filter(b=>(!F.z||BRX[b][0]==F.z)&&(!F.c||BRX[b][1]==F.c)),'All workshops',F.b);
$('fI').innerHTML='<option value="">All items</option>'+ITEMS.map(i=>`<option value="${i}" ${i==F.i?'selected':''}>${dsp(i)} — ${esc(NM[i])}</option>`).join('')}
['C','Z','B','I'].forEach(k=>$('f'+k).onchange=e=>{const m={C:'c',Z:'z',B:'b',I:'i'}[k];F[m]=e.target.value;if(k=='C'){F.z='';F.b=''}if(k=='Z')F.b='';render()});

/* ---------- calc ---------- */
function timeCtx(){const d0=pd(DAY),y=d0.getFullYear(),m=d0.getMonth(),n=new Date(y,m+1,0).getDate(),wd=[];
for(let i=1;i<=n;i++){const s=ymd(new Date(y,m,i));if(isWd(s))wd.push(s)}
const past=wd.filter(x=>x<DAY).length,tot=wd.length,today=isWd(DAY)?1:0,ym=DAY.slice(0,7);
return{wd,past,tot,rem:tot-past,fP:past/tot,fT:(past+today)/tot,ym,y,m,n}}

// achieved value (and qty/load) for one branch+dept, strictly before `cutoff`.
// item: cumulative snapshot (latest reading before cutoff) — from the item-quantity feed.
// no item: revenue — a genuine daily log, so this SUMS every day's row before cutoff.
function achievedBranchDept(branch,dept,cutoff,item){
  if(item){
    const snap=latestBefore(ITEMQ[branch+'|'+dept+'|'+item],cutoff);
    const qty=snap?snap.qty:0;
    return {value:qty*(P[item]||0), qty, load:0};
  }
  const r=sumRevBefore(branch+'|'+dept,cutoff);
  return {value:r.value, qty:0, load:r.load};
}

// per-item achieved units, kept SEPARATE by department (srv vs bds), for the current
// cluster/zone/workshop filter — used to show "SRV" / "BDS" alongside the combined
// figure the rest of the item views already report.
function itemSplit(cutoff){
  const out={}; ITEMS.forEach(i=>out[i]={srv:0,bds:0});
  Object.keys(BRX).filter(b=>inF(BRX[b][1],BRX[b][0],b)).forEach(b=>{
    ['srv','bds'].forEach(dept=>{
      ITEMS.forEach(i=>{
        const snap=latestBefore(ITEMQ[b+'|'+dept+'|'+i],cutoff);
        if(snap) out[i][dept]+=snap.qty;
      });
    });
  });
  return out;
}

function compute(g,sel){
  const T=timeCtx(),M={};
  const get=(k,l)=>M[k]||(M[k]={k,l:l||k,TA:0,TQ:0,LA:0,LQ:0,AA:0,AQ:0});
  // targets / market potential / last-month — from the plan (ADV), unchanged
  ADV.forEach(a=>{if(!inF(a.c,a.z,a.br))return;
    if(g=='item'){ITEMS.forEach(i=>{const e=get(i,dsp(i)+' — '+NM[i]);e.TA+=a.tA[i];e.TQ+=a.tA[i]/P[i];e.LA+=a.lA[i];e.LQ+=a.lA[i]/P[i]})}
    else{const k=gk(g,a.ix,a.br),e=get(k,gl(g,a.ix,a.br));if(sel){e.TA+=a.tA[sel];e.TQ+=a.tA[sel]/P[sel];e.LA+=a.lA[sel];e.LQ+=a.lA[sel]/P[sel]}else{e.TA+=a.tgt;e.TQ+=a.tq;e.LA+=a.last;e.LQ+=a.lq}}
  });
  // achieved — from the live Google Sheet, cumulative snapshots
  const branches=Object.keys(BRX).filter(b=>inF(BRX[b][1],BRX[b][0],b));
  branches.forEach(b=>{
    ['srv','bds'].forEach(dept=>{
      if(g=='item'){
        ITEMS.forEach(i=>{
          const r=achievedBranchDept(b,dept,DAY,i); if(!r.value&&!r.qty) return;
          const e=get(i,dsp(i)+' — '+NM[i]); e.AA+=r.value; e.AQ+=r.qty;
        });
        return;
      }
      const r=achievedBranchDept(b,dept,DAY,sel||null); if(!r.value&&!r.qty) return;
      if(g=='advisor'){
        const advs=ADV.filter(a=>a.br===b && a.dept===dept && inF(a.c,a.z,a.br));
        if(!advs.length){ const e=get('U|'+b+'|'+dept,'Unassigned · '+b); e.AA+=r.value; e.AQ+=r.qty; return; }
        const totW=advs.reduce((s,a)=>s+(sel?(a.tA[sel]||0):a.tgt),0);
        advs.forEach(a=>{
          const w=totW?(sel?(a.tA[sel]||0):a.tgt)/totW:(1/advs.length);
          const k=gk(g,a.ix,a.br),e=get(k,gl(g,a.ix,a.br));
          e.AA+=r.value*w; e.AQ+=r.qty*w;
        });
      } else {
        const k=gk(g,-1,b),e=get(k,gl(g,-1,b));
        e.AA+=r.value; e.AQ+=r.qty;
      }
    });
  });
  const L=Object.values(M);
  L.forEach(e=>{const p=U=='qty'&&(g=='item'||sel||true)?'Q':'A';e.T=e['T'+p];e.L=e['L'+p];e.A=e['A'+p];e.TP=e.T*T.fP;e.gap=e.TP-e.A;e.need=T.rem>0?Math.max(0,(e.T-e.A)/T.rem):Math.max(0,e.T-e.A);e.pct=e.TP?e.A/e.TP*100:null;e.dayPlan=T.tot?e.T/T.tot:0});
  return {L,T};
}

// live-load-based current-performance strip (real cars-serviced count, not item-unit count)
function perfOf(){
  const cutoff=DAY;
  let value=0, load=0;
  Object.keys(BRX).forEach(b=>{ if(!inF(BRX[b][1],BRX[b][0],b)) return;
    ['srv','bds'].forEach(dept=>{ const r=sumRevBefore(b+'|'+dept,cutoff); value+=r.value; load+=r.load; });
  });
  const {L}=compute('cluster',''); let LA=0,TA=0; L.forEach(e=>{LA+=e.LA;TA+=e.TA});
  const advN=ADV.filter(a=>inF(a.c,a.z,a.br)).length||1;
  const T=timeCtx();
  const balance=Math.max(0,TA-value);
  const needDay=T.rem>0?balance/T.rem:balance;
  const avgCar=load?value/load:0;
  return {AA:value, AQ:load, LA, TA, balance, advN, T,
    avgDay:T.past?value/T.past:0, avgAdvDay:T.past?value/(T.past*advN):0, avgCar,
    needDay, needAdvDay:advN?needDay/advN:0, needCarsDay:avgCar?needDay/avgCar:0};
}
function perfStrip(){const p=perfOf();
const onTrack=p.avgDay>=p.needDay*0.999;
return`<h2>Current Business Performance <span style="font-weight:400;color:var(--mut)">— this month so far, current filters</span></h2><div class="chips">
<div class="k"><div class="l">Avg / Day</div><div class="v">${rs(p.avgDay)}</div><div class="s">${p.T.past} working day(s) so far</div></div>
<div class="k"><div class="l">Avg / Advisor / Day</div><div class="v">${rs(p.avgAdvDay)}</div><div class="s">${p.advN} advisor(s)</div></div>
<div class="k"><div class="l">Avg / Car (Ticket Size)</div><div class="v">${p.AQ?rs(p.avgCar):'—'}</div><div class="s">${q(p.AQ)} cars/units so far</div></div>
<div class="k"><div class="l">Total Billed So Far</div><div class="v">${rs(p.AA)}</div><div class="s">this period</div></div>
<div class="k"><div class="l">Last Month, Same Scope</div><div class="v">${rs(p.LA)}</div></div></div>
<h2 style="margin-top:4px">Needed to hit ${rs(p.TA)}<span class="needbadge ${onTrack?'good':'bad'}">${onTrack?'On track at current pace':'Behind — pace must increase'}</span></h2>
<div class="chips">
<div class="k"><div class="l">Balance Left</div><div class="v ${p.balance>0?'bad':'good'}">${rs(p.balance)}</div><div class="s">${p.T.rem} working day(s) left incl. today</div></div>
<div class="k"><div class="l">Req / Day</div><div class="v ${onTrack?'good':'bad'}">${rs(p.needDay)}</div><div class="s">vs current ${rs(p.avgDay)}/day</div></div>
<div class="k"><div class="l">Req / Advisor / Day</div><div class="v ${onTrack?'good':'bad'}">${rs(p.needAdvDay)}</div><div class="s">vs current ${rs(p.avgAdvDay)}</div></div>
<div class="k"><div class="l">Req Cars / Day</div><div class="v ${onTrack?'good':'bad'}">${p.avgCar?q(p.needCarsDay):'—'}</div><div class="s">at current ${rs(p.avgCar)} ticket size</div></div></div>`}

function gk(g,ai,b){if(g=='cluster')return (BRX[b]||['Unmapped','Unmapped'])[1];if(g=='zone')return (BRX[b]||['Unmapped','Unmapped'])[0];if(g=='workshop')return b;return ai>=0?ADV[ai].id:'U|'+b}
function gl(g,ai,b){if(g=='advisor')return ai>=0?ADV[ai].name+' · '+b.slice(3,12):'Unassigned · '+b;return gk(g,ai,b)}
const st=p=>p==null?['—','']:p>=100?['On track','good']:p>=85?['Watch','warn']:['Behind','bad'];
const stCls=p=>p==null?'':p>=100?'good':p>=85?'warn':'bad';

/* ---------- views ---------- */
const TABS=[['today','Today\'s Ask'],['till','Till Date'],['break','Breakdown'],['trend','Trend']];
// Core KPI row — shown on every tab (Today's Ask, Till Date, Breakdown, Trend) so the
// same 5 numbers anchor the whole dashboard. `p` (perfOf() for the current filter scope)
// is optional and adds a compact "actual pace vs needed pace" line underneath, both
// overall and per-advisor — if the real day-to-day growth is slower than what's needed,
// that's called out explicitly instead of only showing in a separate panel.
function head(T,tot,p){
  const target=tot.TA,A=tot.AA,
        TY=target*T.fP,                         // target as of yesterday (date-based, not flat)
        balTY=Math.max(0,TY-A),aheadTY=Math.max(0,A-TY),
        balance=Math.max(0,target-A),
        need=T.rem>0?balance/T.rem:balance,
        dayPlan=T.tot?target/T.tot:0;
  let kpis=`<div class="kpis"><div class="k"><div class="l">Month target</div><div class="v">${rs(target)}</div><div class="s">${T.tot} working days · ${rs(dayPlan)}/day flat pace</div></div>
<div class="k"><div class="l">Achieved till yesterday</div><div class="v">${rs(A)}</div><div class="s">${target?(A/target*100).toFixed(0)+'% of month':'—'}</div></div>
<div class="k"><div class="l">Target till yesterday</div><div class="v">${rs(TY)}</div><div class="s">as of ${addDays(DAY,-1)}</div></div>
<div class="k"><div class="l">Balance vs yesterday's target</div><div class="v ${balTY>0?'bad':'good'}">${balTY>0?rs(balTY):'Ahead (+'+rs(aheadTY)+')'}</div><div class="s ${balTY>0?'bad':'good'}">${balTY>0?'Behind pace':'On/ahead of pace'}</div></div>
<div class="k"><div class="l">Today's target <span style="font-weight:600;color:var(--mut)">(balance ÷ days left)</span></div><div class="v ${need>dayPlan*1.05?'bad':'good'}">${rs(need)}</div><div class="s">${T.rem} working day(s) left incl. today</div></div></div>`;
  if(p){
    const okDay=p.avgDay>=p.needDay*0.999, okAdv=p.avgAdvDay>=p.needAdvDay*0.999;
    kpis+=`<div style="display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:-6px 0 14px">
<span>Avg/day pace: <b class="${okDay?'good':'bad'}">${rs(p.avgDay)}</b> actual vs <b>${rs(p.needDay)}</b> needed <span class="needbadge ${okDay?'good':'bad'}">${okDay?'On track':'Growth too slow'}</span></span>
<span>Avg/advisor/day: <b class="${okAdv?'good':'bad'}">${rs(p.avgAdvDay)}</b> actual vs <b>${rs(p.needAdvDay)}</b> needed <span class="needbadge ${okAdv?'good':'bad'}">${okAdv?'On track':'Growth too slow'}</span></span></div>`;
  }
  return kpis;
}
function totOf(){const {L,T}=compute('cluster','');const t={TA:0,AA:0,LA:0};L.forEach(e=>{t.TA+=e.TA;t.AA+=e.AA;t.LA+=e.LA});return{t,T}}
// "Performance By" — same Cluster/Zone/Workshop/Advisor breakdown as the Breakdown tab
// (shares the same `level`/drill() state), surfaced directly on the home page too, so
// the manager doesn't have to switch tabs to see who's behind. Always whole-VAS (amount),
// independent of the item-card grid's qty-mode U.
function homePerfBy(){
  const {L,T}=compute(level,'');
  const rows=L.map(e=>{
    const target=e.TA,tillDate=target*T.fP,achieved=e.AA,gap=Math.max(0,tillDate-achieved),pct=tillDate?achieved/tillDate*100:(achieved>0?100:null);
    const req=T.rem>0?Math.max(0,target-achieved)/T.rem:Math.max(0,target-achieved);
    const advN=level=='advisor'?1:ADV.filter(a=>gk(level,a.ix,a.br)===e.k && inF(a.c,a.z,a.br)).length;
    const avgAdvDay=T.past&&advN?achieved/(T.past*advN):0, reqAdvDay=advN?req/advN:0;
    return{k:e.k,l:e.l,target,tillDate,achieved,gap,pct,req,advN,avgAdvDay,reqAdvDay};
  }).sort((a,b)=>b.gap-a.gap);
  const top=rows.slice(0,12);
  // Achieved vs TARGET TILL DATE (not the full month figure) — this is what actually shows
  // which workshops are tracking to plan vs falling behind, since we're only partway through the month.
  if(top.length){setTimeout(()=>{const el=$('homeChart');if(!el)return;
    charts.push(new Chart(el,{type:'bar',data:{labels:top.map(r=>r.l),datasets:[
      {label:'Achieved',data:top.map(r=>r.achieved),backgroundColor:'#2E6FDB',borderRadius:4,maxBarThickness:22},
      {label:'Target till date',data:top.map(r=>r.tillDate),backgroundColor:'#E8703A',borderRadius:4,maxBarThickness:22}
    ]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},title:{display:true,text:'Achieved vs target till date, up to '+DAY+' — tracked vs behind'}},scales:{x:{ticks:{callback:v=>rs(v)}}}}}));
  },0)}
  const seg=(arr,cur,fn)=>`<div class="seg">${arr.map(([k,l])=>`<button class="${k==cur?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;
  return`<h2>Performance By <span style="font-weight:400;color:var(--mut)">— ${T.tot} working days this month · ${T.rem} left · click a row to drill in</span></h2>
<div style="margin-bottom:10px">${seg([['cluster','Cluster'],['zone','Zone'],['workshop','Branch / Workshop'],['advisor','Advisor']],level,'setLevel')}</div>
<div class="grid2">
${top.length?`<div class="cv" style="height:${Math.max(220,top.length*34)}px"><canvas id="homeChart"></canvas></div>`:'<div class="tw" style="padding:20px;color:var(--mut)">No rows for this scope</div>'}
<div class="tw" style="max-height:${Math.max(220,top.length*34)+44}px;overflow:auto"><table><thead><tr><th>${level}</th><th>Month target</th><th>Target till date</th><th>Achieved</th><th>Gap</th><th>%</th><th>Req/day</th><th>Advisors</th><th>Avg/advisor/day</th><th>Req/advisor/day</th></tr></thead><tbody>
${rows.length?rows.map(r=>{const s=st(r.pct),advOk=r.avgAdvDay>=r.reqAdvDay*0.999;return`<tr class="cl" onclick="drill('${r.k.replace(/'/g,"\\'")}')"><td>${esc(r.l)}</td><td>${rs(r.target)}</td><td>${rs(r.tillDate)}</td><td>${rs(r.achieved)}</td><td class="${r.gap>0?'bad':'good'}">${rs(r.gap)}</td><td><span class="tag ${s[1]}">${r.pct==null?'—':r.pct.toFixed(0)+'%'}</span></td><td>${rs(r.req)}</td><td>${r.advN}</td><td class="${advOk?'good':'bad'}">${rs(r.avgAdvDay)}</td><td>${rs(r.reqAdvDay)}</td></tr>`}).join(''):'<tr><td colspan="10" style="text-align:center;color:var(--mut);padding:16px">No rows for this scope</td></tr>'}
</tbody></table></div></div>`}
function bigBar(tot,T){const target=tot.TA,A=tot.AA,pct=target?Math.min(100,A/target*100):0;
const needPct=T?Math.min(100,T.fP*100):pct;
return`<div class="bigbar"><div class="row"><span class="pct">${pct.toFixed(0)}% achieved</span><span class="amt">${rs(A)} of ${rs(target)}</span></div><div class="pbbig"><i class="need" style="width:${needPct}%"></i><i class="ach" style="width:${pct}%"></i></div><div style="font-size:11px;color:var(--mut);margin-top:5px;display:flex;align-items:center;gap:14px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--good);margin-right:4px;vertical-align:-1px"></i>Achieved</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--acc);margin-right:4px;vertical-align:-1px"></i>Needed by today (${needPct.toFixed(0)}%)</span></div></div>`}
function vToday(){U='qty';const{L,T}=compute('item','');const{t}=totOf();L.sort((a,b)=>b.TA-a.TA);
const SPLIT=itemSplit(DAY);
return bigBar(t,T)+head(T,t,perfOf())+perfStrip()+homePerfBy()+`<h2>What each item needs today — ${DAY} <span style="font-weight:400;color:var(--mut)">(remaining balance spread evenly across the working days left)</span></h2><div class="grid">`+L.filter(e=>e.T>0.5||e.A>0.5).map(e=>{
  const code=itemOf(e.k),c=stCls(e.pct),price=P[code]||0;
  const noTarget=e.T<=0.5;
  const pctTD=e.pct==null?(e.A>0?100:0):Math.min(100,Math.max(0,e.pct));
  const sp=SPLIT[code]||{srv:0,bds:0};
  return`<div class="ic2 ${c}" onclick="openItem('${code}')">
<div class="h"><b>${dsp(code)}</b><span class="nm">${esc((e.l.split(' — ')[1]||''))}</span></div>
<div class="hero">${q(Math.ceil(e.need))}<span class="heroLbl">units today</span></div>
<div class="sub">${rs(e.need*price)} · plan/day ${q(e.dayPlan)}</div>
<div class="pbbig g"><i style="width:${pctTD}%"></i></div>
<div class="r"><span>Target till yesterday</span><b>${q(e.TP)} u</b></div>
<div class="r"><span>Achieved till yesterday</span><b>${q(e.A)} u</b></div>
<div class="r ${e.gap>0?'gap':''}"><span>${e.gap>0?'Behind':'Ahead'}</span><b style="${e.gap<=0?'color:var(--good)':''}">${q(Math.abs(e.gap))} u</b></div>
<div class="extra"><span>Month target ${q(e.T)} u · Srv ${q(sp.srv)} · Bds ${q(sp.bds)}</span>${noTarget?'<span>No target set</span>':''}</div>
</div>`}).join('')+'</div>'}
const itemOf=k=>k.split(' ')[0]=='RR'?'RD':k.split(' ')[0];
function vTill(){U='qty';const{L,T}=compute('item','');const{t}=totOf();L.sort((a,b)=>b.gap*P[itemOf(b.k)]-a.gap*P[itemOf(a.k)]);
const pie=L.map(e=>({l:e.l.split(' — ')[0],v:e.A*P[itemOf(e.k)]})).filter(e=>e.v>0).sort((a,b)=>b.v-a.v);
if(pie.length){setTimeout(()=>{const el=$('pieChart');if(!el)return;
const palette=['#2E6FDB','#0F9D74','#C0392B','#E8A33D','#8E44AD','#16A085','#D35400','#2C3E50','#27AE60','#C0392B','#7F8C8D','#2980B9','#F39C12','#9B59B6','#1ABC9C','#E74C3C'];
charts.push(new Chart(el,{type:'doughnut',data:{labels:pie.map(e=>e.l),datasets:[{data:pie.map(e=>e.v),backgroundColor:pie.map((_,i)=>palette[i%palette.length])}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:11}}},title:{display:true,text:'Achieved revenue mix by item — till date'},tooltip:{callbacks:{label:c=>c.label+': '+rs(c.parsed)}}}}}));
},0)}
const SPLIT=itemSplit(DAY);
return head(T,t,perfOf())+`<h2>Achievement till date (up to ${DAY}, excluding today)</h2>`+
(pie.length?`<div class="cv" style="height:300px"><canvas id="pieChart"></canvas></div>`:'')+
`<div class="tw"><table><thead><tr><th>Item</th><th>Month target</th><th>Target till date</th><th>Achieved (combined)</th><th>— Srv</th><th>— Bds</th><th>Gap</th><th>Achv %</th><th>Gap ₹</th><th>Status</th></tr></thead><tbody>`+
L.filter(e=>e.T>0.5||e.A>0.5).map(e=>{const s=st(e.pct),code=itemOf(e.k),sp=SPLIT[code]||{srv:0,bds:0};return`<tr class="cl" onclick="openItem('${code}')"><td>${e.l}</td><td>${q(e.T)}</td><td>${q(e.TP)}</td><td>${q(e.A)}</td><td>${q(sp.srv)}</td><td>${q(sp.bds)}</td><td class="${e.gap>0?'bad':'good'}">${e.gap>0?'-'+q(e.gap):'+'+q(-e.gap)}</td><td>${e.pct==null?'—':e.pct.toFixed(0)+'%'}</td><td>${rs(e.gap*P[code])}</td><td><span class="tag ${s[1]}">${s[0]}</span></td></tr>`}).join('')+'</tbody></table></div><div style="font-size:12px;color:var(--mut);margin-top:8px">Counts are units. "Srv"/"Bds" are the SRV Item / BDS Item sheet totals that make up the combined Achieved figure. Click an item to see it by workshop / advisor.</div>'}
function openItem(i){F.i=i;tab='break';U=i?'qty':'amt';render()}
function vBreak(){const sel=F.i||'';const{L,T}=compute(levelKey(),sel);const{t}=totOf();L.sort((a,b)=>b.gap-a.gap);
const seg=(arr,cur,fn)=>`<div class="seg">${arr.map(([k,l])=>`<button class="${k==cur?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;
const sT=L.reduce((s,e)=>s+e.T,0),ch=sel?`<div class="chips"><div class="k"><div class="l">${dsp(sel)} · monthly</div><div class="v">${q(sT)} units</div></div><div class="k"><div class="l">Weekly (6 days)</div><div class="v">${q(sT/T.tot*6)}</div></div><div class="k"><div class="l">Daily plan</div><div class="v">${q(sT/T.tot)}</div></div><div class="k"><div class="l">Revised daily need</div><div class="v">${q(Math.max(0,(sT-L.reduce((s,e)=>s+e.A,0))/T.rem))}</div></div></div>`:'';
const advNote=level=='advisor'?'<p style="font-size:11.5px;color:var(--mut);margin:0 0 10px">Advisor figures are estimated: the sheet reports branch totals only, split here across advisors by their target share.</p>':'';
const top=L.slice(0,12);
if(top.length){setTimeout(()=>{const el=$('breakChart');if(!el)return;
charts.push(new Chart(el,{type:'bar',data:{labels:top.map(e=>e.l),datasets:[
{label:'Achieved',data:top.map(e=>e.A),backgroundColor:'#2E6FDB',borderRadius:4,maxBarThickness:22},
{label:'Target till date',data:top.map(e=>e.TP),backgroundColor:'#C9D4EE',borderRadius:4,maxBarThickness:22}
]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},title:{display:true,text:(sel?dsp(sel)+' — ':'')+'Achieved vs target till date, by '+level+' (top 12 by gap)'}},scales:{x:{ticks:{callback:v=>fv(v)}}}}}));
},0)}
return head(T,t,perfOf())+`<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px">${seg([['cluster','Cluster'],['zone','Zone'],['workshop','Workshop'],['advisor','Advisor']],level,'setLevel')}${seg([['amt','₹ Value'],['qty','Units']],U,'setU')}<b>${sel?dsp(sel)+' — '+esc(NM[sel]):'All items'}</b>${sel?'<button class="btn g" style="color:var(--acc);background:var(--line)" onclick="openItem(\'\')">Clear item</button>':''}</div>${ch}${advNote}
${top.length?`<div class="cv" style="height:${Math.max(220,top.length*34)}px"><canvas id="breakChart"></canvas></div>`:''}
<div class="tw"><table><thead><tr><th>${level}</th><th>Last 3-mo avg</th><th>Month target</th><th>Plan/day</th><th>Target till date</th><th>Achieved</th><th>Gap</th><th>Achv %</th><th>Needed/day now</th><th>Status</th></tr></thead><tbody>`+
(L.length?L.map(e=>{const s=st(e.pct);return`<tr class="cl" onclick="drill('${e.k.replace(/'/g,"\\'")}')"><td>${esc(e.l)}</td><td>${fv(e.L)}</td><td>${fv(e.T)}</td><td>${fv(e.dayPlan)}</td><td>${fv(e.TP)}</td><td>${fv(e.A)}</td><td class="${e.gap>0?'bad':'good'}">${e.gap>0?'-':'+'}${fv(Math.abs(e.gap))}</td><td>${e.pct==null?'—':e.pct.toFixed(0)+'%'}</td><td>${fv(e.need)}</td><td><span class="tag ${s[1]}">${s[0]}</span></td></tr>`}).join(''):'<tr><td colspan="10" style="text-align:center;color:var(--mut);padding:20px">No rows for this scope</td></tr>')+`</tbody></table></div><div style="font-size:12px;color:var(--mut);margin-top:8px">"Last 3-mo avg" = May–Jul average from the ₹1 Cr plan file. Sorted by largest gap first. Click a row to drill down.</div>`}
const levelKey=()=>level;
function setLevel(l){level=l;render()}function setU(u){U=u;render()}
function drill(k){if(level=='cluster'){F.c=k;level='zone'}else if(level=='zone'){F.z=k;const m=Object.keys(BRX).find(b=>BRX[b][0]==k);F.c=m?BRX[m][1]:'';level='workshop'}else if(level=='workshop'){F.b=k;F.z=(BRX[k]||['',''])[0];F.c=(BRX[k]||['',''])[1];level='advisor'}render()}

// cumulative achieved (whole scope, optional item) AS OF a given calendar day — the sheet's own semantics
function cumulativeAt(day,item){
  let v=0;
  Object.keys(BRX).forEach(b=>{ if(!inF(BRX[b][1],BRX[b][0],b)) return;
    ['srv','bds'].forEach(dept=>{
      if(item){ const snap=latestAtOrBefore(ITEMQ[b+'|'+dept+'|'+item],day); if(snap) v+=snap.qty*(P[item]||0); }
      else { v+=sumRevAtOrBefore(b+'|'+dept,day).value; }
    });
  });
  return v;
}
function vTrend(){
  const T=timeCtx(),sel=F.i;const{t:tHead}=totOf();
  let tgt=0;ADV.forEach(a=>{if(inF(a.c,a.z,a.br))tgt+=sel?(a.tA[sel]||0):a.tgt});
  const days=T.wd;
  const A=cumulativeAt(addDays(DAY,-1),sel);
  const need=T.rem>0?Math.max(0,(tgt-A)/T.rem):Math.max(0,tgt-A);
  const act=[],cA=[],cT=[],plan=[],rev=[],path=[];
  days.forEach((d,i)=>{const past=d<DAY;plan.push(tgt/T.tot);cT.push(tgt*(i+1)/T.tot);
    if(past){const cum=cumulativeAt(d,sel);const prev=cumulativeAt(addDays(d,-1),sel);cA.push(cum);act.push(cum-prev);rev.push(null);}
    else{cA.push(null);act.push(null);rev.push(need);}
    path.push(null);
  });
  if(T.past>0)path[T.past-1]=A;
  for(let i=T.past;i<days.length;i++)path[i]=A+need*(i-T.past+1);
  setTimeout(()=>{const lb=days.map(d=>+d.slice(8)),o=(t)=>({responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:t}},scales:{y:{ticks:{callback:v=>rs(v)}}},interaction:{mode:'index',intersect:false}});
  const L=(l,d,c,dash)=>({label:l,data:d,borderColor:c,backgroundColor:c,pointRadius:2,tension:.25,borderDash:dash||[],spanGaps:false});
  charts.push(new Chart($('c1'),{type:'line',data:{labels:lb,datasets:[L('Achieved / day',act,'#2E6FDB'),L('Plan / day',plan,'#0F9D74',[6,4]),L('Revised need / day',rev,'#C0392B',[2,3])]},options:o('Day-wise achievement — '+(sel?dsp(sel):'all items'))}));
  charts.push(new Chart($('c2'),{type:'line',data:{labels:lb,datasets:[L('Cumulative achieved',cA,'#2E6FDB'),L('Cumulative target',cT,'#0F9D74',[6,4]),L('Path needed to hit target',path,'#C0392B',[2,3])]},options:o('Cumulative vs target')}))},0);
  return head(T,tHead,perfOf())+`<div class="cv"><canvas id="c1"></canvas></div><div class="cv"><canvas id="c2"></canvas></div><p style="font-size:11.5px;color:var(--mut);margin-top:-4px">"Achieved / day" is the change between consecutive sheet updates — if a day is skipped, its progress shows on the next date the sheet was updated.</p>`}

function render(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[];fillSel();$('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';if(tab=='break')U=F.i?'qty':'amt';render()">${l}</button>`).join('');
const ld=lastDataDate();const nBranches=Object.keys(REV).map(k=>k.split('|')[0]).filter((v,i,a)=>a.indexOf(v)===i).length;
$('stat').textContent=ld?`Cumulative through ${ld} · ${nBranches} branch(es) reporting`:'No data synced yet';
let h='';
if(SYNC_ERR)h+=`<div class="note">⚠ Could not reach the Google Sheet just now (${esc(SYNC_ERR)}). ${LAST_SYNC?'Showing the last successfully synced data.':'Click Refresh to try again.'}</div>`;
if(!ld && !SYNC_ERR)h+=`<div class="note" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">No data synced from the sheet yet.</div>`;
const warnMsgs=SYNC_WARN.filter(w=>!w.startsWith('unk:'));
h+=`<details><summary>Connected data source</summary><p>Reading live from your Google Sheet — tabs <b>${esc(TAB_REVENUE)}</b>, <b>${esc(TAB_SRV)}</b>, <b>${esc(TAB_BDS)}</b>. Each row is read as your <b>cumulative month-to-date total as of its Date column</b> (not a single day's transactions) — matches your "till date" report format. The latest date found is treated as "achieved through yesterday," and Today's Ask projects forward from there. Advisor-level achieved is <b>estimated</b> by splitting each branch+department's real total across its advisors in proportion to their monthly target share — the sheet itself reports branch totals only, not per-advisor figures.</p>${warnMsgs.length?'<p style="color:var(--warn)">'+warnMsgs.map(esc).join('<br>')+'</p>':''}</details>`;
h+=({today:vToday,till:vTill,break:vBreak,trend:vTrend})[tab]();$('main').innerHTML=h}

function effDark(){const t=document.documentElement.dataset.theme;return t?t=='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function applyTheme(t){document.documentElement.dataset.theme=t;$('thm').textContent=t=='dark'?'☀ Light':'🌙 Dark';try{localStorage.setItem('vas1cr_theme',t)}catch(e){}if(tab=='trend')render()}
function toggleTheme(){applyTheme(effDark()?'light':'dark')}
let th=null;try{th=localStorage.getItem('vas1cr_theme')}catch(e){}
$('tgtChip').textContent='Target '+rs(TOTAL_TARGET);
BRX=Object.assign({},BR);
setToday();
applyTheme(th||(effDark()?'dark':'light'));
render();
fetchAll(false);
</script></body></html>
