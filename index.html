/* ==================================================================
   LIVE GOOGLE SHEET CONNECTION
   Reads 3 tabs — "VAS Revenue", "SRV Item", "BDS Item" — from the
   user's published sheet. Each row is treated as a CUMULATIVE
   month-to-date snapshot AS OF its Date column (matches how the user
   described the sheet: "shows till 21 Sep"), not a single day's
   isolated transactions. "Achieved through day X" = the latest
   snapshot on or before X, per branch+department. No advisor-level
   figures exist in the feed, so advisor rows are estimated by
   splitting each branch+department's real total across its advisors
   in proportion to their monthly target share.
   ================================================================== */
const SHEET_ID='1dM0nil7-O10_nzvVmtq43W5oY5h3AIoZ4sfa3WymA2E';
const TAB_REVENUE='VAS Revenue', TAB_SRV='SRV Item', TAB_BDS='BDS Item';
const CACHE_KEY='vas1cr_sheet_cache_v1';
let BRX={};                 // branch -> [zone,cluster], BR extended with any branch the sheet reports that isn't in the plan
let REV={};                 // "branch|dept" -> [{date,value,load}, ...] ascending
let ITEMQ={};                // "branch|dept|item" -> [{date,qty}, ...] ascending
let LAST_SYNC=null, SYNC_ERR=null, SYNC_WARN=[], FETCHING=false;

function gvizUrl(name){
  if(window.__GVIZ_OVERRIDE__ && window.__GVIZ_OVERRIDE__[name]) return window.__GVIZ_OVERRIDE__[name];
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&_ts=${Date.now()}`;
}
function num(v){const n=parseFloat(String(v==null?'':v).replace(/,/g,'').trim());return isNaN(n)?0:n}
function csvRows(text){const wb=XLSX.read(text,{type:'string'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
function findCol(H,re){return H.findIndex(h=>re.test(String(h||'').trim()))}
async function fetchTab(name){
  const res=await fetch(gvizUrl(name),{cache:'no-store'});
  if(!res.ok) throw new Error(name+': HTTP '+res.status);
  const text=await res.text();
  if(/^\s*</.test(text)) throw new Error(name+': the sheet did not return CSV — check it is shared as "Anyone with the link can view"');
  return csvRows(text);
}
function mergeBranch(name, liveZone){
  if(!name) return;
  if(!BRX[name]) BRX[name]=BR[name]?BR[name].slice():[liveZone||'Unmapped','Unmapped'];
  else if(!BR[name] && liveZone && BRX[name][0]==='Unmapped') BRX[name][0]=liveZone;
}
function pushSorted(map,key,rec){(map[key]=map[key]||[]).push(rec)}
function finalizeSorted(map){Object.values(map).forEach(arr=>arr.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0))}
function latestBefore(arr,day){if(!arr)return null;let best=null;for(const s of arr){if(s.date<day)best=s;else break}return best}
function latestAtOrBefore(arr,day){if(!arr)return null;let best=null;for(const s of arr){if(s.date<=day)best=s;else break}return best}

function parseRevenue(rows){
  if(!rows||!rows.length) return;
  const H=rows[0];
  const iDate=findCol(H,/^date/i);
  const iBdsLoad=findCol(H,/bodyshop load/i), iBdsVas=iBdsLoad>=0?iBdsLoad+1:-1;
  const iSrvLoad=findCol(H,/service load/i), iSrvVas=iSrvLoad>=0?iSrvLoad+1:-1;
  if(iDate<0){SYNC_WARN.push(TAB_REVENUE+': no "Date" column found');return}
  let curZone='';
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row||!row.length) continue;
    const zc=String(row[0]||'').trim(), bc=String(row[1]||'').trim();
    if(zc && zc!=='Total') curZone=zc;
    if(!bc || bc==='Total') continue;
    const date=toDate(row[iDate]); if(!date) continue;
    mergeBranch(bc,curZone);
    if(iBdsVas>=0) pushSorted(REV, bc+'|bds', {date, value:num(row[iBdsVas]), load:num(row[iBdsLoad])});
    if(iSrvVas>=0) pushSorted(REV, bc+'|srv', {date, value:num(row[iSrvVas]), load:num(row[iSrvLoad])});
  }
}
function parseItemSheet(rows, dept, label){
  if(!rows||!rows.length) return;
  const H=rows[0];
  const iDate=findCol(H,/^date/i);
  if(iDate<0){SYNC_WARN.push(label+': no "Date" column found');return}
  const items=[];
  for(let i=2;i<iDate;i++){
    const h=String(H[i]||'').trim(); if(!h) continue;
    if(/^total\b/i.test(h)) continue;
    let code=h.split(' Count')[0].trim();
    if(code==='RR') code='RD';
    if(!P[code]){ if(!SYNC_WARN.includes('unk:'+code)){SYNC_WARN.push('unk:'+code); SYNC_WARN.push(label+': unrecognized item code "'+code+'" — ignored');} continue; }
    items.push({code, idx:i});
  }
  let curZone='';
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row||!row.length) continue;
    const zc=String(row[0]||'').trim(), bc=String(row[1]||'').trim();
    if(zc && zc!=='Total') curZone=zc;
    if(!bc || bc==='Total') continue;
    const date=toDate(row[iDate]); if(!date) continue;
    mergeBranch(bc,curZone);
    items.forEach(({code,idx})=>{ pushSorted(ITEMQ, bc+'|'+dept+'|'+code, {date, qty:num(row[idx])}); });
  }
}
function setSync(text,kind){
  const el=$('syncStatus'); el.textContent=text;
  el.style.background = kind=='ok'?'rgba(15,157,116,.32)' : kind=='bad'?'rgba(192,57,43,.4)' : 'rgba(255,255,255,.12)';
}
function saveCache(){try{localStorage.setItem(CACHE_KEY, JSON.stringify({REV,ITEMQ,BRX,ts:LAST_SYNC?LAST_SYNC.toISOString():null}))}catch(e){}}
function loadCache(){try{const raw=localStorage.getItem(CACHE_KEY);if(!raw)return false;const p=JSON.parse(raw);REV=p.REV||{};ITEMQ=p.ITEMQ||{};BRX=Object.assign({},BR,p.BRX||{});LAST_SYNC=p.ts?new Date(p.ts):null;return true}catch(e){return false}}

async function fetchAll(manual){
  if(FETCHING) return; FETCHING=true;
  setSync('Syncing…','busy');
  const warn=[];
  try{
    const [rev,srv,bds]=await Promise.all([fetchTab(TAB_REVENUE), fetchTab(TAB_SRV), fetchTab(TAB_BDS)]);
    const newREV={}, newITEMQ={}, newBRX={}; Object.keys(BR).forEach(b=>newBRX[b]=BR[b].slice());
    REV=newREV; ITEMQ=newITEMQ; BRX=newBRX; SYNC_WARN=[];
    parseRevenue(rev);
    parseItemSheet(srv,'srv',TAB_SRV);
    parseItemSheet(bds,'bds',TAB_BDS);
    finalizeSorted(REV); finalizeSorted(ITEMQ);
    LAST_SYNC=new Date(); SYNC_ERR=null;
    saveCache();
    setDayFromData();
    setSync('● Live — synced '+LAST_SYNC.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),'ok');
  }catch(err){
    SYNC_ERR=String(err&&err.message||err);
    const had=loadCache();
    setSync(had?'⚠ Could not reach the sheet — showing last saved data':'⚠ Could not reach the sheet','bad');
    if(had) setDayFromData();
  }
  FETCHING=false;
  render();
}

/* ---------- date of latest data / tracking-day default ---------- */
function lastDataDate(){let m='';Object.values(REV).forEach(arr=>arr.forEach(s=>{if(s.date>m)m=s.date}));Object.values(ITEMQ).forEach(arr=>arr.forEach(s=>{if(s.date>m)m=s.date}));return m}
function setDayFromData(){let ld=lastDataDate();let d=ld?pd(ld):new Date();if(ld)d.setDate(d.getDate()+1);while(d.getDay()==0)d.setDate(d.getDate()+1);DAY=ymd(d);$('dayIn').value=DAY}

/* ---------- filters ---------- */
const inF=(c,z,b)=>(!F.c||c==F.c)&&(!F.z||z==F.z)&&(!F.b||b==F.b);
function fillSel(){const brs=Object.keys(BRX).sort();const opt=(id,arr,all,cur)=>{$(id).innerHTML=`<option value="">${all}</option>`+arr.map(x=>`<option value="${esc(x)}" ${x==cur?'selected':''}>${esc(x)}</option>`).join('')};
opt('fC',[...new Set(brs.map(b=>BRX[b][1]))].sort(),'All clusters',F.c);
opt('fZ',[...new Set(brs.filter(b=>!F.c||BRX[b][1]==F.c).map(b=>BRX[b][0]))].sort(),'All zones',F.z);
opt('fB',brs.filter(b=>(!F.z||BRX[b][0]==F.z)&&(!F.c||BRX[b][1]==F.c)),'All workshops',F.b);
$('fI').innerHTML='<option value="">All items</option>'+ITEMS.map(i=>`<option value="${i}" ${i==F.i?'selected':''}>${dsp(i)} — ${esc(NM[i])}</option>`).join('')}
['C','Z','B','I'].forEach(k=>$('f'+k).onchange=e=>{const m={C:'c',Z:'z',B:'b',I:'i'}[k];F[m]=e.target.value;if(k=='C'){F.z='';F.b=''}if(k=='Z')F.b='';render()});
$('dayIn').onchange=e=>{if(e.target.value){DAY=e.target.value;render()}};

/* ---------- calc ---------- */
function timeCtx(){const d0=pd(DAY),y=d0.getFullYear(),m=d0.getMonth(),n=new Date(y,m+1,0).getDate(),wd=[];
for(let i=1;i<=n;i++){const s=ymd(new Date(y,m,i));if(isWd(s))wd.push(s)}
const past=wd.filter(x=>x<DAY).length,tot=wd.length,today=isWd(DAY)?1:0,ym=DAY.slice(0,7);
return{wd,past,tot,rem:tot-past,fP:past/tot,fT:(past+today)/tot,ym,y,m,n}}

// achieved value (and qty/load) for one branch+dept, as of the latest snapshot strictly before `cutoff`.
// item: pass an item code to read from the item-quantity feed instead of the revenue feed.
function achievedBranchDept(branch,dept,cutoff,item){
  if(item){
    const snap=latestBefore(ITEMQ[branch+'|'+dept+'|'+item],cutoff);
    const qty=snap?snap.qty:0;
    return {value:qty*(P[item]||0), qty, load:0};
  }
  const snap=latestBefore(REV[branch+'|'+dept],cutoff);
  return {value:snap?snap.value:0, qty:0, load:snap?snap.load:0};
}

function compute(g,sel){
  const T=timeCtx(),M={};
  const get=(k,l)=>M[k]||(M[k]={k,l:l||k,TA:0,TQ:0,LA:0,LQ:0,AA:0,AQ:0});
  // targets / market potential / last-month — from the plan (ADV), unchanged
  ADV.forEach(a=>{if(!inF(a.c,a.z,a.br))return;
    if(g=='item'){ITEMS.forEach(i=>{const e=get(i,dsp(i)+' — '+NM[i]);e.TA+=a.tA[i];e.TQ+=a.tA[i]/P[i];e.LA+=a.lA[i];e.LQ+=a.lA[i]/P[i]})}
    else{const k=gk(g,a.ix,a.br),e=get(k,gl(g,a.ix,a.br));if(sel){e.TA+=a.tA[sel];e.TQ+=a.tA[sel]/P[sel];e.LA+=a.lA[sel];e.LQ+=a.lA[sel]/P[sel]}else{e.TA+=a.tgt;e.TQ+=a.tq;e.LA+=a.last;e.LQ+=a.lq}}
  });
  // achieved — from the live Google Sheet, cumulative snapshots
  const branches=Object.keys(BRX).filter(b=>inF(BRX[b][1],BRX[b][0],b));
  branches.forEach(b=>{
    ['srv','bds'].forEach(dept=>{
      if(g=='item'){
        ITEMS.forEach(i=>{
          const r=achievedBranchDept(b,dept,DAY,i); if(!r.value&&!r.qty) return;
          const e=get(i,dsp(i)+' — '+NM[i]); e.AA+=r.value; e.AQ+=r.qty;
        });
        return;
      }
      const r=achievedBranchDept(b,dept,DAY,sel||null); if(!r.value&&!r.qty) return;
      if(g=='advisor'){
        const advs=ADV.filter(a=>a.br===b && a.dept===dept && inF(a.c,a.z,a.br));
        if(!advs.length){ const e=get('U|'+b+'|'+dept,'Unassigned · '+b); e.AA+=r.value; e.AQ+=r.qty; return; }
        const totW=advs.reduce((s,a)=>s+(sel?(a.tA[sel]||0):a.tgt),0);
        advs.forEach(a=>{
          const w=totW?(sel?(a.tA[sel]||0):a.tgt)/totW:(1/advs.length);
          const k=gk(g,a.ix,a.br),e=get(k,gl(g,a.ix,a.br));
          e.AA+=r.value*w; e.AQ+=r.qty*w;
        });
      } else {
        const k=gk(g,-1,b),e=get(k,gl(g,-1,b));
        e.AA+=r.value; e.AQ+=r.qty;
      }
    });
  });
  const L=Object.values(M);
  L.forEach(e=>{const p=U=='qty'&&(g=='item'||sel||true)?'Q':'A';e.T=e['T'+p];e.L=e['L'+p];e.A=e['A'+p];e.TP=e.T*T.fP;e.TT=e.T*T.fT;e.gap=e.TP-e.A;e.ask=Math.max(0,e.TT-e.A);e.need=T.rem>0?Math.max(0,(e.T-e.A)/T.rem):Math.max(0,e.T-e.A);e.pct=e.TP?e.A/e.TP*100:null;e.dayPlan=T.tot?e.T/T.tot:0});
  return {L,T};
}

// live-load-based current-performance strip (real cars-serviced count, not item-unit count)
function perfOf(){
  const cutoff=DAY;
  let value=0, load=0;
  Object.keys(BRX).forEach(b=>{ if(!inF(BRX[b][1],BRX[b][0],b)) return;
    ['srv','bds'].forEach(dept=>{ const snap=latestBefore(REV[b+'|'+dept],cutoff); if(snap){ value+=snap.value; load+=snap.load; } });
  });
  const {L}=compute('cluster',''); let LA=0; L.forEach(e=>LA+=e.LA);
  const advN=ADV.filter(a=>inF(a.c,a.z,a.br)).length||1;
  const T=timeCtx();
  return {AA:value, AQ:load, LA, advN, avgDay:T.past?value/T.past:0, avgAdvDay:T.past?value/(T.past*advN):0, avgCar:load?value/load:0};
}
function perfStrip(){const p=perfOf();
return`<h2>Current performance <span style="font-weight:400;color:var(--mut)">— this month so far, current filters</span></h2><div class="chips">
<div class="k"><div class="l">Avg / Working Day</div><div class="v">${rs(p.avgDay)}</div></div>
<div class="k"><div class="l">Avg / Advisor / Day</div><div class="v">${rs(p.avgAdvDay)}</div><div class="s">${p.advN} advisor(s) in scope</div></div>
<div class="k"><div class="l">Avg / Car (ticket size)</div><div class="v">${p.AQ?rs(p.avgCar):'—'}</div><div class="s">${q(p.AQ)} car(s) serviced</div></div>
<div class="k"><div class="l">Last Month, Same Scope</div><div class="v">${rs(p.LA)}</div></div></div>`}

function gk(g,ai,b){if(g=='cluster')return (BRX[b]||['Unmapped','Unmapped'])[1];if(g=='zone')return (BRX[b]||['Unmapped','Unmapped'])[0];if(g=='workshop')return b;return ai>=0?ADV[ai].id:'U|'+b}
function gl(g,ai,b){if(g=='advisor')return ai>=0?ADV[ai].name+' · '+b.slice(3,12):'Unassigned · '+b;return gk(g,ai,b)}
const st=p=>p==null?['—','']:p>=100?['On track','good']:p>=85?['Watch','warn']:['Behind','bad'];
const stCls=p=>p==null?'':p>=100?'good':p>=85?'warn':'bad';

/* ---------- views ---------- */
const TABS=[['today','Today\'s Ask'],['till','Till Date'],['break','Breakdown'],['trend','Trend']];
function head(T,tot){const A=tot.AA,TP=tot.TA*T.fP,TT=tot.TA*T.fT,gap=TP-A,need=T.rem>0?Math.max(0,(tot.TA-A)/T.rem):Math.max(0,tot.TA-A),run=T.past?A/T.past*T.tot:0,dayPlan=T.tot?tot.TA/T.tot:0;
return`<div class="kpis"><div class="k"><div class="l">Month target</div><div class="v">${rs(tot.TA)}</div><div class="s">${T.tot} working days · ${rs(dayPlan)}/day</div></div>
<div class="k"><div class="l">Achieved till yesterday</div><div class="v">${rs(A)}</div><div class="s">${tot.TA?(A/tot.TA*100).toFixed(1)+'% of month':'—'}</div></div>
<div class="k"><div class="l">Target till yesterday</div><div class="v">${rs(TP)}</div><div class="s ${gap>0?'bad':'good'}">${gap>0?'Behind by '+rs(gap):'Ahead by '+rs(-gap)}</div></div>
<div class="k"><div class="l">Today's ask</div><div class="v">${rs(Math.max(0,TT-A))}</div><div class="s">plan ${rs(dayPlan)} + carried gap</div></div>
<div class="k"><div class="l">Revised need / day</div><div class="v ${need>dayPlan*1.05?'bad':'good'}">${rs(need)}</div><div class="s">${T.rem} working days left</div></div>
<div class="k"><div class="l">Month-end at current pace</div><div class="v ${run>=tot.TA?'good':'bad'}">${T.past?rs(run):'—'}</div><div class="s">${T.past?(run/tot.TA*100).toFixed(0)+'% of target':'no data yet'}</div></div></div>`}
function totOf(){const {L,T}=compute('cluster','');const t={TA:0,AA:0,LA:0};L.forEach(e=>{t.TA+=e.TA;t.AA+=e.AA;t.LA+=e.LA});return{t,T}}
function vToday(){U='qty';const{L,T}=compute('item','');const{t}=totOf();L.sort((a,b)=>b.TA-a.TA);
return perfStrip()+head(T,t)+`<h2>What each item needs today — ${DAY} <span style="font-weight:400;color:var(--mut)">(units = plan for today + units missed earlier)</span></h2><div class="grid">`+L.filter(e=>e.T>0.5).map(e=>{const c=stCls(e.pct);
return`<div class="ic ${c}" onclick="openItem('${itemOf(e.k)}')"><div class="n">${e.l.split(' — ')[0]}</div><div class="nm">${e.l.split(' — ')[1]}</div>
<div class="big">${q(Math.ceil(e.ask))} <span style="font-size:12px;font-weight:600;color:var(--mut)">units today</span></div><div class="sub">${rs(e.ask*P[itemOf(e.k)])} · plan/day ${q(e.dayPlan)}</div>
<div class="pb"><i style="width:${Math.min(100,e.T?e.A/e.T*100:0)}%"></i></div><div class="sub">Done ${q(e.A)} of ${q(e.T)} · ${e.gap>0?'behind '+q(e.gap):'ahead '+q(-e.gap)}</div></div>`}).join('')+'</div>'}
const itemOf=k=>k.split(' ')[0]=='RR'?'RD':k.split(' ')[0];
function vTill(){U='qty';const{L,T}=compute('item','');const{t}=totOf();L.sort((a,b)=>b.gap*P[itemOf(b.k)]-a.gap*P[itemOf(a.k)]);
return head(T,t)+`<h2>Achievement till date (up to ${DAY}, excluding today)</h2><div class="tw"><table><thead><tr><th>Item</th><th>Month target</th><th>Target till date</th><th>Achieved</th><th>Gap</th><th>Achv %</th><th>Gap ₹</th><th>Status</th></tr></thead><tbody>`+
L.filter(e=>e.T>0.5).map(e=>{const s=st(e.pct);return`<tr class="cl" onclick="openItem('${itemOf(e.k)}')"><td>${e.l}</td><td>${q(e.T)}</td><td>${q(e.TP)}</td><td>${q(e.A)}</td><td class="${e.gap>0?'bad':'good'}">${e.gap>0?'-'+q(e.gap):'+'+q(-e.gap)}</td><td>${e.pct==null?'—':e.pct.toFixed(0)+'%'}</td><td>${rs(e.gap*P[itemOf(e.k)])}</td><td><span class="tag ${s[1]}">${s[0]}</span></td></tr>`}).join('')+'</tbody></table></div><div style="font-size:12px;color:var(--mut);margin-top:8px">Counts are units. Click an item to see it by workshop / advisor.</div>'}
function openItem(i){F.i=i;tab='break';U=i?'qty':'amt';render()}
function vBreak(){const sel=F.i||'';const{L,T}=compute(levelKey(),sel);const{t}=totOf();L.sort((a,b)=>b.gap-a.gap);
const seg=(arr,cur,fn)=>`<div class="seg">${arr.map(([k,l])=>`<button class="${k==cur?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;
const sT=L.reduce((s,e)=>s+e.T,0),ch=sel?`<div class="chips"><div class="k"><div class="l">${dsp(sel)} · monthly</div><div class="v">${q(sT)} units</div></div><div class="k"><div class="l">Weekly (6 days)</div><div class="v">${q(sT/T.tot*6)}</div></div><div class="k"><div class="l">Daily plan</div><div class="v">${q(sT/T.tot)}</div></div><div class="k"><div class="l">Revised daily need</div><div class="v">${q(Math.max(0,(sT-L.reduce((s,e)=>s+e.A,0))/T.rem))}</div></div></div>`:'';
const advNote=level=='advisor'?'<p style="font-size:11.5px;color:var(--mut);margin:0 0 10px">Advisor figures are estimated: the sheet reports branch totals only, split here across advisors by their target share.</p>':'';
return`<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px">${seg([['cluster','Cluster'],['zone','Zone'],['workshop','Workshop'],['advisor','Advisor']],level,'setLevel')}${seg([['amt','₹ Value'],['qty','Units']],U,'setU')}<b>${sel?dsp(sel)+' — '+esc(NM[sel]):'All items'}</b>${sel?'<button class="btn g" style="color:var(--acc);background:var(--line)" onclick="openItem(\'\')">Clear item</button>':''}</div>${ch}${advNote}
<div class="tw"><table><thead><tr><th>${level}</th><th>Last 3-mo avg</th><th>Month target</th><th>Plan/day</th><th>Target till date</th><th>Achieved</th><th>Gap</th><th>Achv %</th><th>Needed/day now</th><th>Status</th></tr></thead><tbody>`+
(L.length?L.map(e=>{const s=st(e.pct);return`<tr class="cl" onclick="drill('${e.k.replace(/'/g,"\\'")}')"><td>${esc(e.l)}</td><td>${fv(e.L)}</td><td>${fv(e.T)}</td><td>${fv(e.dayPlan)}</td><td>${fv(e.TP)}</td><td>${fv(e.A)}</td><td class="${e.gap>0?'bad':'good'}">${e.gap>0?'-':'+'}${fv(Math.abs(e.gap))}</td><td>${e.pct==null?'—':e.pct.toFixed(0)+'%'}</td><td>${fv(e.need)}</td><td><span class="tag ${s[1]}">${s[0]}</span></td></tr>`}).join(''):'<tr><td colspan="10" style="text-align:center;color:var(--mut);padding:20px">No rows for this scope</td></tr>')+`</tbody></table></div><div style="font-size:12px;color:var(--mut);margin-top:8px">"Last 3-mo avg" = May–Jul average from the ₹1 Cr plan file. Sorted by largest gap first. Click a row to drill down.</div>`}
const levelKey=()=>level;
function setLevel(l){level=l;render()}function setU(u){U=u;render()}
function drill(k){if(level=='cluster'){F.c=k;level='zone'}else if(level=='zone'){F.z=k;const m=Object.keys(BRX).find(b=>BRX[b][0]==k);F.c=m?BRX[m][1]:'';level='workshop'}else if(level=='workshop'){F.b=k;F.z=(BRX[k]||['',''])[0];F.c=(BRX[k]||['',''])[1];level='advisor'}render()}

// cumulative achieved (whole scope, optional item) AS OF a given calendar day — the sheet's own semantics
function cumulativeAt(day,item){
  let v=0;
  Object.keys(BRX).forEach(b=>{ if(!inF(BRX[b][1],BRX[b][0],b)) return;
    ['srv','bds'].forEach(dept=>{
      if(item){ const snap=latestAtOrBefore(ITEMQ[b+'|'+dept+'|'+item],day); if(snap) v+=snap.qty*(P[item]||0); }
      else { const snap=latestAtOrBefore(REV[b+'|'+dept],day); if(snap) v+=snap.value; }
    });
  });
  return v;
}
function vTrend(){
  const T=timeCtx(),sel=F.i;
  let tgt=0;ADV.forEach(a=>{if(inF(a.c,a.z,a.br))tgt+=sel?(a.tA[sel]||0):a.tgt});
  const days=T.wd;
  const A=cumulativeAt(addDays(DAY,-1),sel);
  const need=T.rem>0?Math.max(0,(tgt-A)/T.rem):Math.max(0,tgt-A);
  const act=[],cA=[],cT=[],plan=[],rev=[],path=[];
  days.forEach((d,i)=>{const past=d<DAY;plan.push(tgt/T.tot);cT.push(tgt*(i+1)/T.tot);
    if(past){const cum=cumulativeAt(d,sel);const prev=cumulativeAt(addDays(d,-1),sel);cA.push(cum);act.push(cum-prev);rev.push(null);}
    else{cA.push(null);act.push(null);rev.push(need);}
    path.push(null);
  });
  if(T.past>0)path[T.past-1]=A;
  for(let i=T.past;i<days.length;i++)path[i]=A+need*(i-T.past+1);
  setTimeout(()=>{charts.forEach(c=>c.destroy());charts=[];const lb=days.map(d=>+d.slice(8)),o=(t)=>({responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:t}},scales:{y:{ticks:{callback:v=>rs(v)}}},interaction:{mode:'index',intersect:false}});
  const L=(l,d,c,dash)=>({label:l,data:d,borderColor:c,backgroundColor:c,pointRadius:2,tension:.25,borderDash:dash||[],spanGaps:false});
  charts.push(new Chart($('c1'),{type:'line',data:{labels:lb,datasets:[L('Achieved / day',act,'#2E6FDB'),L('Plan / day',plan,'#0F9D74',[6,4]),L('Revised need / day',rev,'#C0392B',[2,3])]},options:o('Day-wise achievement — '+(sel?dsp(sel):'all items'))}));
  charts.push(new Chart($('c2'),{type:'line',data:{labels:lb,datasets:[L('Cumulative achieved',cA,'#2E6FDB'),L('Cumulative target',cT,'#0F9D74',[6,4]),L('Path needed to hit target',path,'#C0392B',[2,3])]},options:o('Cumulative vs target')}))},0);
  return`<div class="cv"><canvas id="c1"></canvas></div><div class="cv"><canvas id="c2"></canvas></div><p style="font-size:11.5px;color:var(--mut);margin-top:-4px">"Achieved / day" is the change between consecutive sheet updates — if a day is skipped, its progress shows on the next date the sheet was updated.</p>`}

function render(){fillSel();$('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';if(tab=='break')U=F.i?'qty':'amt';render()">${l}</button>`).join('');
const ld=lastDataDate();const nBranches=Object.keys(REV).map(k=>k.split('|')[0]).filter((v,i,a)=>a.indexOf(v)===i).length;
$('stat').textContent=ld?`Cumulative through ${ld} · ${nBranches} branch(es) reporting`:'No data synced yet';
let h='';
if(SYNC_ERR)h+=`<div class="note">⚠ Could not reach the Google Sheet just now (${esc(SYNC_ERR)}). ${LAST_SYNC?'Showing the last successfully synced data.':'Click Refresh to try again.'}</div>`;
if(!ld && !SYNC_ERR)h+=`<div class="note" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">No data synced from the sheet yet.</div>`;
const warnMsgs=SYNC_WARN.filter(w=>!w.startsWith('unk:'));
h+=`<details><summary>Connected data source</summary><p>Reading live from your Google Sheet — tabs <b>${esc(TAB_REVENUE)}</b>, <b>${esc(TAB_SRV)}</b>, <b>${esc(TAB_BDS)}</b>. Each row is read as your <b>cumulative month-to-date total as of its Date column</b> (not a single day's transactions) — matches your "till date" report format. The latest date found is treated as "achieved through yesterday," and Today's Ask projects forward from there. Advisor-level achieved is <b>estimated</b> by splitting each branch+department's real total across its advisors in proportion to their monthly target share — the sheet itself reports branch totals only, not per-advisor figures.</p>${warnMsgs.length?'<p style="color:var(--warn)">'+warnMsgs.map(esc).join('<br>')+'</p>':''}</details>`;
h+=({today:vToday,till:vTill,break:vBreak,trend:vTrend})[tab]();$('main').innerHTML=h}

function effDark(){const t=document.documentElement.dataset.theme;return t?t=='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function applyTheme(t){document.documentElement.dataset.theme=t;$('thm').textContent=t=='dark'?'☀ Light':'🌙 Dark';try{localStorage.setItem('vas1cr_theme',t)}catch(e){}if(tab=='trend')render()}
function toggleTheme(){applyTheme(effDark()?'light':'dark')}
let th=null;try{th=localStorage.getItem('vas1cr_theme')}catch(e){}
$('tgtChip').textContent='Target '+rs(TOTAL_TARGET);
BRX=Object.assign({},BR);
DAY=ymd(new Date());$('dayIn').value=DAY;
applyTheme(th||(effDark()?'dark':'light'));
render();
fetchAll(false);
</script></body></html>
